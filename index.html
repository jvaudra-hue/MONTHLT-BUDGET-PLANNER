
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.planner{padding:1rem 0}
.month-bar{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
.month-bar select,.month-bar input{height:36px;padding:0 10px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-size:14px;font-family:var(--font-sans)}
.month-bar input{width:80px}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem}
.metric{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:1rem}
.metric-label{font-size:12px;color:var(--color-text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.metric-value{font-size:22px;font-weight:500;color:var(--color-text-primary)}
.metric-value.pos{color:#1D9E75}
.metric-value.neg{color:#E24B4A}
.metric-value.warn{color:#BA7517}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:1.5rem}
.section{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.section-full{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:1rem}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:0.5px solid var(--color-border-tertiary)}
.section-title{font-size:14px;font-weight:500;color:var(--color-text-primary);display:flex;align-items:center;gap:8px}
.section-total{font-size:14px;font-weight:500}
.section-total.income{color:#1D9E75}
.section-total.expense{color:#E24B4A}
.section-total.debt{color:#BA7517}
.rows{min-height:40px}
.row{display:grid;grid-template-columns:1fr 110px 32px;align-items:center;gap:8px;padding:8px 16px;border-bottom:0.5px solid var(--color-border-tertiary)}
.row:last-child{border-bottom:none}
.row input[type=text]{border:none;background:transparent;color:var(--color-text-primary);font-size:13px;font-family:var(--font-sans);width:100%;outline:none}
.row input[type=text]::placeholder{color:var(--color-text-tertiary)}
.row input[type=number]{height:28px;width:110px;padding:0 8px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:13px;font-family:var(--font-sans);text-align:right}
.del-btn{width:24px;height:24px;border:none;background:none;color:var(--color-text-tertiary);cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;transition:color .15s}
.del-btn:hover{color:#E24B4A}
.add-btn{display:flex;align-items:center;gap:6px;margin:8px 16px;padding:6px 10px;border:none;background:none;color:var(--color-text-secondary);font-size:13px;cursor:pointer;border-radius:var(--border-radius-md);transition:background .15s;font-family:var(--font-sans)}
.add-btn:hover{background:var(--color-background-secondary)}
.debt-row{display:grid;grid-template-columns:1fr 100px 100px 32px;align-items:center;gap:8px;padding:8px 16px;border-bottom:0.5px solid var(--color-border-tertiary)}
.debt-row:last-child{border-bottom:none}
.debt-row input[type=text]{border:none;background:transparent;color:var(--color-text-primary);font-size:13px;font-family:var(--font-sans);width:100%;outline:none}
.debt-row input[type=text]::placeholder{color:var(--color-text-tertiary)}
.debt-row input[type=number]{height:28px;padding:0 8px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:13px;font-family:var(--font-sans);text-align:right;width:100%}
.col-headers{display:grid;grid-template-columns:1fr 100px 100px 32px;gap:8px;padding:6px 16px;background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary)}
.col-h{font-size:11px;color:var(--color-text-secondary);text-align:right}
.col-h:first-child{text-align:left}
.bar-wrap{margin:1rem 0 0.5rem;padding:0 16px}
.bar-track{height:8px;background:var(--color-background-secondary);border-radius:4px;overflow:hidden;display:flex}
.bar-income{background:#1D9E75;transition:width .3s}
.bar-expense{background:#E24B4A;transition:width .3s}
.bar-debt{background:#BA7517;transition:width .3s}
.bar-legend{display:flex;gap:16px;font-size:12px;color:var(--color-text-secondary);padding:6px 16px 14px;flex-wrap:wrap}
.leg-dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
.surplus-banner{padding:10px 16px;font-size:13px;display:flex;align-items:center;gap:8px;border-top:0.5px solid var(--color-border-tertiary)}
</style>

<div class="planner">
  <h2 class="sr-only">Monthly budget planner with income, expenses, and debts</h2>

  <div class="month-bar">
    <i class="ti ti-calendar" aria-hidden="true" style="font-size:20px;color:var(--color-text-secondary)"></i>
    <select id="monthSel">
      <option>January</option><option>February</option><option>March</option><option>April</option>
      <option>May</option><option>June</option><option>July</option><option>August</option>
      <option>September</option><option>October</option><option>November</option><option>December</option>
    </select>
    <input type="number" id="yearSel" value="2026" min="2000" max="2099" style="width:80px">
    <span style="flex:1"></span>
    <span style="font-size:13px;color:var(--color-text-secondary)" id="dateLabel"></span>
  </div>

  <div class="summary-grid">
    <div class="metric">
      <div class="metric-label"><i class="ti ti-arrow-up" aria-hidden="true"></i> Total income</div>
      <div class="metric-value pos" id="sumIncome">₱0</div>
    </div>
    <div class="metric">
      <div class="metric-label"><i class="ti ti-arrow-down" aria-hidden="true"></i> Total expenses</div>
      <div class="metric-value neg" id="sumExpense">₱0</div>
    </div>
    <div class="metric">
      <div class="metric-label"><i class="ti ti-credit-card" aria-hidden="true"></i> Debt payments</div>
      <div class="metric-value warn" id="sumDebt">₱0</div>
    </div>
    <div class="metric">
      <div class="metric-label"><i class="ti ti-wallet" aria-hidden="true"></i> Net balance</div>
      <div class="metric-value" id="sumNet">₱0</div>
    </div>
  </div>

  <div class="sections">
    <div class="section">
      <div class="section-header">
        <div class="section-title"><i class="ti ti-trending-up" aria-hidden="true" style="color:#1D9E75;font-size:16px"></i> Income</div>
        <span class="section-total income" id="incomeTotal">₱0</span>
      </div>
      <div class="rows" id="incomeRows"></div>
      <button class="add-btn" onclick="addRow('income')"><i class="ti ti-plus" aria-hidden="true"></i> Add income</button>
    </div>
    <div class="section">
      <div class="section-header">
        <div class="section-title"><i class="ti ti-receipt" aria-hidden="true" style="color:#E24B4A;font-size:16px"></i> Expenses</div>
        <span class="section-total expense" id="expenseTotal">₱0</span>
      </div>
      <div class="rows" id="expenseRows"></div>
      <button class="add-btn" onclick="addRow('expense')"><i class="ti ti-plus" aria-hidden="true"></i> Add expense</button>
    </div>
  </div>

  <div class="section-full">
    <div class="section-header">
      <div class="section-title"><i class="ti ti-credit-card" aria-hidden="true" style="color:#BA7517;font-size:16px"></i> Debts & loans</div>
      <span class="section-total debt" id="debtTotal">₱0/mo</span>
    </div>
    <div class="col-headers">
      <div class="col-h">Name</div>
      <div class="col-h">Balance owed</div>
      <div class="col-h">Monthly payment</div>
      <div class="col-h"></div>
    </div>
    <div class="rows" id="debtRows"></div>
    <button class="add-btn" onclick="addRow('debt')"><i class="ti ti-plus" aria-hidden="true"></i> Add debt</button>
  </div>

  <div class="section-full" style="margin-bottom:0">
    <div class="section-header">
      <div class="section-title"><i class="ti ti-chart-bar" aria-hidden="true" style="font-size:16px;color:var(--color-text-secondary)"></i> Breakdown</div>
    </div>
    <div class="bar-wrap">
      <div class="bar-track" id="barTrack">
        <div class="bar-income" id="barIncome" style="width:0%"></div>
        <div class="bar-expense" id="barExpense" style="width:0%"></div>
        <div class="bar-debt" id="barDebt" style="width:0%"></div>
      </div>
    </div>
    <div class="bar-legend">
      <span><span class="leg-dot" style="background:#1D9E75"></span>Income</span>
      <span><span class="leg-dot" style="background:#E24B4A"></span>Expenses</span>
      <span><span class="leg-dot" style="background:#BA7517"></span>Debt payments</span>
    </div>
    <div class="surplus-banner" id="surplusBanner"></div>
  </div>
</div>

<script>
const state={income:[],expense:[],debt:[]};
let uid=0;

function fmt(n){return'₱'+Math.round(n).toLocaleString();}

function addRow(type,label='',amount='',balance=''){
  const id='r'+(uid++);
  if(type==='debt'){
    state.debt.push({id,label,amount,balance});
  } else {
    state[type].push({id,label,amount});
  }
  render();
  setTimeout(()=>{
    const el=document.getElementById('lbl_'+id);
    if(el)el.focus();
  },10);
}

function removeRow(type,id){
  state[type]=state[type].filter(r=>r.id!==id);
  render();
}

function getVal(id){
  const el=document.getElementById(id);
  return el?parseFloat(el.value)||0:0;
}

function render(){
  const ir=document.getElementById('incomeRows');
  const er=document.getElementById('expenseRows');
  const dr=document.getElementById('debtRows');

  ir.innerHTML=state.income.map(r=>`
    <div class="row">
      <input type="text" id="lbl_${r.id}" placeholder="e.g. Salary" value="${r.label}" oninput="state.income.find(x=>x.id==='${r.id}').label=this.value" />
      <input type="number" id="amt_${r.id}" placeholder="0" value="${r.amount}" min="0" oninput="state.income.find(x=>x.id==='${r.id}').amount=this.value;calc()" />
      <button class="del-btn" onclick="removeRow('income','${r.id}')" aria-label="Remove row"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>`).join('');

  er.innerHTML=state.expense.map(r=>`
    <div class="row">
      <input type="text" id="lbl_${r.id}" placeholder="e.g. Groceries" value="${r.label}" oninput="state.expense.find(x=>x.id==='${r.id}').label=this.value" />
      <input type="number" id="amt_${r.id}" placeholder="0" value="${r.amount}" min="0" oninput="state.expense.find(x=>x.id==='${r.id}').amount=this.value;calc()" />
      <button class="del-btn" onclick="removeRow('expense','${r.id}')" aria-label="Remove row"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>`).join('');

  dr.innerHTML=state.debt.map(r=>`
    <div class="debt-row">
      <input type="text" id="lbl_${r.id}" placeholder="e.g. Car loan" value="${r.label}" oninput="state.debt.find(x=>x.id==='${r.id}').label=this.value" />
      <input type="number" id="bal_${r.id}" placeholder="0" value="${r.balance}" min="0" oninput="state.debt.find(x=>x.id==='${r.id}').balance=this.value;calc()" />
      <input type="number" id="amt_${r.id}" placeholder="0" value="${r.amount}" min="0" oninput="state.debt.find(x=>x.id==='${r.id}').amount=this.value;calc()" />
      <button class="del-btn" onclick="removeRow('debt','${r.id}')" aria-label="Remove row"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>`).join('');

  calc();
}

function calc(){
  const income=state.income.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  const expense=state.expense.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  const debtPay=state.debt.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  const net=income-expense-debtPay;

  document.getElementById('sumIncome').textContent=fmt(income);
  document.getElementById('sumExpense').textContent=fmt(expense);
  document.getElementById('sumDebt').textContent=fmt(debtPay);
  const netEl=document.getElementById('sumNet');
  netEl.textContent=fmt(net);
  netEl.className='metric-value '+(net>0?'pos':net<0?'neg':'');

  document.getElementById('incomeTotal').textContent=fmt(income);
  document.getElementById('expenseTotal').textContent=fmt(expense);
  document.getElementById('debtTotal').textContent=fmt(debtPay)+'/mo';

  const total=income+expense+debtPay;
  const ip=total?Math.round(income/total*100):0;
  const ep=total?Math.round(expense/total*100):0;
  const dp=total?Math.round(debtPay/total*100):0;
  document.getElementById('barIncome').style.width=ip+'%';
  document.getElementById('barExpense').style.width=ep+'%';
  document.getElementById('barDebt').style.width=dp+'%';

  const banner=document.getElementById('surplusBanner');
  if(income===0){
    banner.innerHTML='<i class="ti ti-info-circle" aria-hidden="true" style="color:var(--color-text-tertiary)"></i><span style="color:var(--color-text-secondary)">Add your income and expenses to see your net balance.</span>';
  } else if(net>0){
    banner.innerHTML=`<i class="ti ti-circle-check" aria-hidden="true" style="color:#1D9E75"></i><span style="color:#1D9E75;font-weight:500">Surplus: ${fmt(net)}</span><span style="color:var(--color-text-secondary);font-size:12px;margin-left:4px">— you have money to save or invest this month.</span>`;
  } else if(net===0){
    banner.innerHTML=`<i class="ti ti-minus-circle" aria-hidden="true" style="color:#BA7517"></i><span style="color:#BA7517;font-weight:500">Break even</span><span style="color:var(--color-text-secondary);font-size:12px;margin-left:4px">— income exactly covers all costs.</span>`;
  } else {
    banner.innerHTML=`<i class="ti ti-alert-triangle" aria-hidden="true" style="color:#E24B4A"></i><span style="color:#E24B4A;font-weight:500">Deficit: ${fmt(Math.abs(net))}</span><span style="color:var(--color-text-secondary);font-size:12px;margin-left:4px">— expenses and debts exceed your income.</span>`;
  }
}

const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
const sel=document.getElementById('monthSel');
const yr=document.getElementById('yearSel');
const now=new Date();
sel.value=months[now.getMonth()];
yr.value=now.getFullYear();

function updateLabel(){
  document.getElementById('dateLabel').textContent=sel.value+' '+yr.value;
}
sel.addEventListener('change',updateLabel);
yr.addEventListener('input',updateLabel);
updateLabel();

addRow('income','Salary',0,'');
addRow('expense','Rent / mortgage',0,'');
addRow('expense','Food & groceries',0,'');
addRow('debt','Credit card','','');
</script>
