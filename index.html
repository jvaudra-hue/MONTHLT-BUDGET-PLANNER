<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Budget Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --surface2: #f1f0ec;
    --border: rgba(0,0,0,0.10);
    --border-mid: rgba(0,0,0,0.18);
    --text: #1a1a18;
    --text-muted: #6b6b67;
    --text-faint: #a8a8a4;
    --green: #1D9E75;
    --green-bg: #e1f5ee;
    --red: #E24B4A;
    --red-bg: #fcebeb;
    --amber: #BA7517;
    --amber-bg: #faeeda;
    --radius: 10px;
    --radius-lg: 14px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container { max-width: 780px; margin: 0 auto; }

  .header { margin-bottom: 2rem; }
  .header h1 { font-size: 22px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  .header p { font-size: 13px; color: var(--text-muted); }

  .month-bar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 1.5rem;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
  }
  .month-bar i { font-size: 18px; color: var(--text-muted); }
  .month-bar select, .month-bar input[type=number] {
    border: 0.5px solid var(--border-mid);
    border-radius: 7px;
    background: var(--surface2);
    color: var(--text);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    height: 34px;
    padding: 0 10px;
    outline: none;
    cursor: pointer;
  }
  .month-bar input[type=number] { width: 76px; }
  .month-bar select:focus, .month-bar input:focus { border-color: var(--green); }
  .month-bar .spacer { flex: 1; }
  .month-label { font-size: 13px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 1.5rem;
  }
  @media (max-width: 600px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }

  .metric {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .metric-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 5px;
  }
  .metric-label i { font-size: 13px; }
  .metric-value { font-size: 20px; font-weight: 500; color: var(--text); font-family: 'DM Mono', monospace; }
  .metric-value.pos { color: var(--green); }
  .metric-value.neg { color: var(--red); }
  .metric-value.warn { color: var(--amber); }

  .sections {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }
  @media (max-width: 560px) { .sections { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .card-full { margin-bottom: 14px; }

  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 0.5px solid var(--border);
  }
  .card-title { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .card-total { font-size: 13px; font-weight: 500; font-family: 'DM Mono', monospace; }
  .card-total.income { color: var(--green); }
  .card-total.expense { color: var(--red); }
  .card-total.debt { color: var(--amber); }

  .col-headers {
    display: grid;
    grid-template-columns: 1fr 110px 110px 30px;
    gap: 8px;
    padding: 6px 16px;
    background: var(--surface2);
    border-bottom: 0.5px solid var(--border);
  }
  .col-h { font-size: 11px; color: var(--text-muted); text-align: right; }
  .col-h:first-child { text-align: left; }

  .row {
    display: grid;
    grid-template-columns: 1fr 110px 30px;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-bottom: 0.5px solid var(--border);
    transition: background .12s;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--surface2); }

  .debt-row {
    display: grid;
    grid-template-columns: 1fr 110px 110px 30px;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-bottom: 0.5px solid var(--border);
    transition: background .12s;
  }
  .debt-row:last-child { border-bottom: none; }
  .debt-row:hover { background: var(--surface2); }

  input[type=text] {
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    width: 100%;
    outline: none;
  }
  input[type=text]::placeholder { color: var(--text-faint); }

  input[type=number] {
    height: 28px;
    padding: 0 8px;
    border: 0.5px solid var(--border-mid);
    border-radius: 7px;
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    text-align: right;
    width: 100%;
    outline: none;
    -moz-appearance: textfield;
  }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type=number]:focus { border-color: var(--green); }

  .del-btn {
    width: 24px; height: 24px;
    border: none; background: none;
    color: var(--text-faint);
    cursor: pointer;
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    transition: color .12s, background .12s;
  }
  .del-btn:hover { color: var(--red); background: var(--red-bg); }

  .add-btn {
    display: flex; align-items: center; gap: 6px;
    margin: 8px 12px;
    padding: 6px 10px;
    border: none; background: none;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    border-radius: 7px;
    font-family: 'DM Sans', sans-serif;
    transition: background .12s, color .12s;
  }
  .add-btn:hover { background: var(--surface2); color: var(--text); }

  .breakdown-card { margin-bottom: 0; }

  .bar-wrap { padding: 16px 16px 4px; }
  .bar-track {
    height: 10px;
    background: var(--surface2);
    border-radius: 5px;
    overflow: hidden;
    display: flex;
  }
  .bar-seg { transition: width .4s cubic-bezier(.4,0,.2,1); height: 100%; }
  .bar-income { background: var(--green); }
  .bar-expense { background: var(--red); }
  .bar-debt { background: var(--amber); }

  .bar-legend {
    display: flex; gap: 16px; flex-wrap: wrap;
    font-size: 12px; color: var(--text-muted);
    padding: 10px 16px 14px;
  }
  .leg-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: middle; }

  .surplus-banner {
    padding: 11px 16px;
    font-size: 13px;
    display: flex; align-items: center; gap: 8px;
    border-top: 0.5px solid var(--border);
    min-height: 42px;
  }

  .empty-state {
    padding: 18px 16px;
    font-size: 13px;
    color: var(--text-faint);
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Monthly Budget Planner</h1>
    <p>Track your income, expenses, and debt payments in one place.</p>
  </div>

  <div class="month-bar">
    <i class="ti ti-calendar"></i>
    <select id="monthSel">
      <option>January</option><option>February</option><option>March</option>
      <option>April</option><option>May</option><option>June</option>
      <option>July</option><option>August</option><option>September</option>
      <option>October</option><option>November</option><option>December</option>
    </select>
    <input type="number" id="yearSel" value="2026" min="2000" max="2099">
    <div class="spacer"></div>
    <span class="month-label" id="dateLabel"></span>
  </div>

  <div class="summary-grid">
    <div class="metric">
      <div class="metric-label"><i class="ti ti-arrow-up-circle"></i> Total income</div>
      <div class="metric-value pos" id="sumIncome">₱0</div>
    </div>
    <div class="metric">
      <div class="metric-label"><i class="ti ti-arrow-down-circle"></i> Total expenses</div>
      <div class="metric-value neg" id="sumExpense">₱0</div>
    </div>
    <div class="metric">
      <div class="metric-label"><i class="ti ti-credit-card"></i> Debt payments</div>
      <div class="metric-value warn" id="sumDebt">₱0</div>
    </div>
    <div class="metric">
      <div class="metric-label"><i class="ti ti-wallet"></i> Net balance</div>
      <div class="metric-value" id="sumNet">₱0</div>
    </div>
  </div>

  <div class="sections">
    <div class="card">
      <div class="card-header">
        <div class="card-title"><i class="ti ti-trending-up" style="color:var(--green);font-size:15px"></i> Income</div>
        <span class="card-total income" id="incomeTotal">₱0</span>
      </div>
      <div id="incomeRows"></div>
      <button class="add-btn" onclick="addRow('income')"><i class="ti ti-plus"></i> Add income</button>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title"><i class="ti ti-receipt" style="color:var(--red);font-size:15px"></i> Expenses</div>
        <span class="card-total expense" id="expenseTotal">₱0</span>
      </div>
      <div id="expenseRows"></div>
      <button class="add-btn" onclick="addRow('expense')"><i class="ti ti-plus"></i> Add expense</button>
    </div>
  </div>

  <div class="card card-full">
    <div class="card-header">
      <div class="card-title"><i class="ti ti-credit-card" style="color:var(--amber);font-size:15px"></i> Debts & loans</div>
      <span class="card-total debt" id="debtTotal">₱0/mo</span>
    </div>
    <div class="col-headers">
      <div class="col-h">Name</div>
      <div class="col-h">Balance owed</div>
      <div class="col-h">Monthly payment</div>
      <div class="col-h"></div>
    </div>
    <div id="debtRows"></div>
    <button class="add-btn" onclick="addRow('debt')"><i class="ti ti-plus"></i> Add debt</button>
  </div>

  <div class="card breakdown-card">
    <div class="card-header">
      <div class="card-title"><i class="ti ti-chart-bar" style="font-size:15px;color:var(--text-muted)"></i> Breakdown</div>
    </div>
    <div class="bar-wrap">
      <div class="bar-track">
        <div class="bar-seg bar-income" id="barIncome" style="width:0%"></div>
        <div class="bar-seg bar-expense" id="barExpense" style="width:0%"></div>
        <div class="bar-seg bar-debt" id="barDebt" style="width:0%"></div>
      </div>
    </div>
    <div class="bar-legend">
      <span><span class="leg-dot" style="background:var(--green)"></span>Income</span>
      <span><span class="leg-dot" style="background:var(--red)"></span>Expenses</span>
      <span><span class="leg-dot" style="background:var(--amber)"></span>Debt payments</span>
    </div>
    <div class="surplus-banner" id="surplusBanner"></div>
  </div>
</div>

<script>
// All data stored per month key: "January-2026"
// Persisted to localStorage so data survives refresh/close
const STORAGE_KEY = 'budget_planner_v1';
let allData = {};
let state = { income: [], expense: [], debt: [] };
let uid = 0;
let currentKey = '';

const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const sel = document.getElementById('monthSel');
const yr = document.getElementById('yearSel');
const now = new Date();
sel.value = months[now.getMonth()];
yr.value = now.getFullYear();

function monthKey() {
  return sel.value + '-' + yr.value;
}

function persistAll() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ allData, uid })); } catch(e) {}
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      allData = parsed.allData || {};
      uid = parsed.uid || 0;
    }
  } catch(e) {}
}

function saveCurrentMonth() {
  if (!currentKey) return;
  allData[currentKey] = JSON.parse(JSON.stringify(state));
  persistAll();
}

function loadMonth(key) {
  if (allData[key]) {
    state = JSON.parse(JSON.stringify(allData[key]));
  } else {
    // Fresh month — start with blank template rows
    state = {
      income: [{ id: 'r'+(uid++), label: 'Salary', amount: '', balance: '' }],
      expense: [
        { id: 'r'+(uid++), label: 'Rent / mortgage', amount: '' },
        { id: 'r'+(uid++), label: 'Food & groceries', amount: '' }
      ],
      debt: [{ id: 'r'+(uid++), label: 'Credit card', amount: '', balance: '' }]
    };
  }
}

function switchMonth() {
  saveCurrentMonth();
  currentKey = monthKey();
  loadMonth(currentKey);
  updateLabel();
  render();
}

function updateLabel() {
  document.getElementById('dateLabel').textContent = sel.value + ' ' + yr.value;
}

sel.addEventListener('change', switchMonth);
yr.addEventListener('change', switchMonth);

function fmt(n) {
  return '₱' + Math.round(Math.abs(n)).toLocaleString();
}

function addRow(type, label = '', amount = '', balance = '') {
  const id = 'r' + (uid++);
  if (type === 'debt') {
    state.debt.push({ id, label, amount, balance });
  } else {
    state[type].push({ id, label, amount });
  }
  saveCurrentMonth();
  render();
  setTimeout(() => {
    const el = document.getElementById('lbl_' + id);
    if (el) el.focus();
  }, 20);
}

function removeRow(type, id) {
  state[type] = state[type].filter(r => r.id !== id);
  saveCurrentMonth();
  render();
}

function onInput(type, id, field, val) {
  const item = state[type].find(x => x.id === id);
  if (item) item[field] = val;
  saveCurrentMonth();
  calc();
}

function render() {
  const ir = document.getElementById('incomeRows');
  const er = document.getElementById('expenseRows');
  const dr = document.getElementById('debtRows');

  if (state.income.length === 0) {
    ir.innerHTML = '<div class="empty-state">No income added yet.</div>';
  } else {
    ir.innerHTML = state.income.map(r => `
      <div class="row">
        <input type="text" id="lbl_${r.id}" placeholder="e.g. Salary" value="${escHtml(r.label)}"
          oninput="onInput('income','${r.id}','label',this.value)">
        <input type="number" id="amt_${r.id}" placeholder="0" value="${r.amount}" min="0" step="1"
          oninput="onInput('income','${r.id}','amount',this.value)">
        <button class="del-btn" onclick="removeRow('income','${r.id}')" title="Remove"><i class="ti ti-x"></i></button>
      </div>`).join('');
  }

  if (state.expense.length === 0) {
    er.innerHTML = '<div class="empty-state">No expenses added yet.</div>';
  } else {
    er.innerHTML = state.expense.map(r => `
      <div class="row">
        <input type="text" id="lbl_${r.id}" placeholder="e.g. Groceries" value="${escHtml(r.label)}"
          oninput="onInput('expense','${r.id}','label',this.value)">
        <input type="number" id="amt_${r.id}" placeholder="0" value="${r.amount}" min="0" step="1"
          oninput="onInput('expense','${r.id}','amount',this.value)">
        <button class="del-btn" onclick="removeRow('expense','${r.id}')" title="Remove"><i class="ti ti-x"></i></button>
      </div>`).join('');
  }

  if (state.debt.length === 0) {
    dr.innerHTML = '<div class="empty-state">No debts added yet.</div>';
  } else {
    dr.innerHTML = state.debt.map(r => `
      <div class="debt-row">
        <input type="text" id="lbl_${r.id}" placeholder="e.g. Car loan" value="${escHtml(r.label)}"
          oninput="onInput('debt','${r.id}','label',this.value)">
        <input type="number" id="bal_${r.id}" placeholder="0" value="${r.balance}" min="0" step="1"
          oninput="onInput('debt','${r.id}','balance',this.value)">
        <input type="number" id="amt_${r.id}" placeholder="0" value="${r.amount}" min="0" step="1"
          oninput="onInput('debt','${r.id}','amount',this.value)">
        <button class="del-btn" onclick="removeRow('debt','${r.id}')" title="Remove"><i class="ti ti-x"></i></button>
      </div>`).join('');
  }

  calc();
}

function escHtml(s) {
  return String(s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function calc() {
  const income = state.income.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
  const expense = state.expense.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
  const debtPay = state.debt.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
  const net = income - expense - debtPay;

  document.getElementById('sumIncome').textContent = fmt(income);
  document.getElementById('sumExpense').textContent = fmt(expense);
  document.getElementById('sumDebt').textContent = fmt(debtPay);
  const netEl = document.getElementById('sumNet');
  netEl.textContent = (net < 0 ? '-' : '') + fmt(net);
  netEl.className = 'metric-value ' + (net > 0 ? 'pos' : net < 0 ? 'neg' : '');

  document.getElementById('incomeTotal').textContent = fmt(income);
  document.getElementById('expenseTotal').textContent = fmt(expense);
  document.getElementById('debtTotal').textContent = fmt(debtPay) + '/mo';

  const total = income + expense + debtPay;
  const ip = total ? Math.round(income / total * 100) : 0;
  const ep = total ? Math.round(expense / total * 100) : 0;
  const dp = total ? Math.round(debtPay / total * 100) : 0;
  document.getElementById('barIncome').style.width = ip + '%';
  document.getElementById('barExpense').style.width = ep + '%';
  document.getElementById('barDebt').style.width = dp + '%';

  const banner = document.getElementById('surplusBanner');
  if (income === 0) {
    banner.innerHTML = '<i class="ti ti-info-circle" style="color:#a8a8a4;font-size:16px"></i><span style="color:#6b6b67">Add your income and expenses to see your net balance.</span>';
  } else if (net > 0) {
    banner.innerHTML = `<i class="ti ti-circle-check" style="color:var(--green);font-size:16px"></i><span style="color:var(--green);font-weight:500">Surplus: ${fmt(net)}</span><span style="color:#6b6b67;font-size:12px;margin-left:4px">— you have money to save or invest this month.</span>`;
  } else if (net === 0) {
    banner.innerHTML = `<i class="ti ti-minus-circle" style="color:var(--amber);font-size:16px"></i><span style="color:var(--amber);font-weight:500">Break even</span><span style="color:#6b6b67;font-size:12px;margin-left:4px">— income exactly covers all costs.</span>`;
  } else {
    banner.innerHTML = `<i class="ti ti-alert-triangle" style="color:var(--red);font-size:16px"></i><span style="color:var(--red);font-weight:500">Deficit: ${fmt(Math.abs(net))}</span><span style="color:#6b6b67;font-size:12px;margin-left:4px">— expenses and debts exceed your income.</span>`;
  }
}

// Init — load saved data from localStorage first
loadFromStorage();
currentKey = monthKey();
loadMonth(currentKey);
updateLabel();
render();
</script>
</body>
</html>
